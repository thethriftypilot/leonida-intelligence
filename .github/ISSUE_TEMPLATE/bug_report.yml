name: Bug report
description: Something in the app doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Tools → …
        2. Click …
  - type: dropdown
    id: host
    attributes:
      label: How do you run it?
      options:
        - Windows (setup.ps1 / start.cmd)
        - Docker
        - Linux (systemd / npm start)
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: e.g. Chrome on Windows 11, Safari on iPad
  - type: textarea
    id: logs
    attributes:
      label: Server window output or error message
      render: text
