name: Feature idea
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the problem it solves for you while playing.
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data source (if it needs new location data)
      description: Which openly licensed source or API would provide it?
